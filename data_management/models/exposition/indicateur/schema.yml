version: 2

models:
  - name: indicateur_territoire_valeur_evenement_taux_avancement
    description: >
      Table reliant les indicateur_territoire_valeur_evenement à leur Taux d'avancement annuels (TAA)
      et taux d'avancement global (TAG) pour chaque VA non issue d'aggrégation et pour les territoires
      pour lesquels l'indicateur est applicable lorsque leur calcul est possible.
    config:
        materialized: table
        indexes: 
          - columns: ['evenement_id']
          - columns: ['indic_id']
          - columns: ['territoire_code']
    columns:
      - name : evenement_id
        tests:
          - unique
          - not_null
        constraints:
          - type: not_null
          - type: primary_key
          - type: foreign_key
            to: source('db_schema_public', 'indicateur_territoire_valeur_evenement')
      - name : ta_indic_id
        tests:
          - not_null:
              config:
                severity: warn
