version: 2

unit_tests:
    - name: int_last_meteo
      description: "Sélection de la dernière météo (= dernière date de modification) pour chaque chantier-territoire."
      model: int_last_meteo
      given:
        - input: source('db_schema_public', 'synthese_des_resultats')
          format: sql
          rows: |
            SELECT
              'CH-090' AS chantier_id,
              'DEPT-01' AS territoire_code,
              'COUVERT' AS meteo,
              '2021-01-05'::date AS date_creation,
              '2021-01-05'::date AS date_modification,
              'dept'::text AS maille,
              '01' AS code_insee,
              '4c8aae44-393b-4561-a03f-14e10780a992' AS auteur_creation_id,
              '4c8aae44-393b-4561-a03f-14e10780a992' AS auteur_modification_id
            UNION ALL
            SELECT
              'CH-090' AS chantier_id,
              'DEPT-01' AS territoire_code,
              'SOLEIL' AS meteo,
              '2021-01-10'::date AS date_creation,
              '2021-01-10'::date AS date_modification,
              'dept'::text AS maille,
              '01' AS code_insee,
              '4c8aae44-393b-4561-a03f-14e10780a992' AS auteur_creation_id,
              '4c8aae44-393b-4561-a03f-14e10780a992' AS auteur_modification_id
            UNION ALL
            SELECT
              'CH-090' AS chantier_id,
              'DEPT-01' AS territoire_code,
              'ORAGE' AS meteo,
              '2021-01-07'::date AS date_creation,
              '2021-01-15'::date AS date_modification,
              'dept'::text AS maille,
              '01' AS code_insee,
              '4c8aae44-393b-4561-a03f-14e10780a992' AS auteur_creation_id,
              '4c8aae44-393b-4561-a03f-14e10780a992' AS auteur_modification_id
        - input: source('db_schema_public', 'territoire')
          format: sql
          rows: |
            SELECT
              'DEPT-01' AS code,
              'Ain' AS nom,
              '01 - Ain' AS nom_affiche,
              'dept'::maille AS maille,
              '01' AS code_insee,
              'REG-84' AS code_parent,
              'D01' AS zone_id
      expect:
        rows:
          - { chantier_id: 'CH-090', territoire_code: 'DEPT-01', meteo: 'ORAGE', date_meteo: '2021-01-15' }


