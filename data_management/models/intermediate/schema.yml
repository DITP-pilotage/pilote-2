version: 2

models:
  - name: int_chantiers_with_mailles_and_territoires
    description: "Vue intermédiaire afin de décliner les chantiers pour tous leurs territoires (maille + code insee)"
  - name: int_indicateurs_zones_applicables
    description: "Une ligne pour chaque indicateur X chaque territoire. Uniquement les indicateurs applicables sur une zone groupe. Indique si l'indicateur est applicable sur le territoire"
    columns:
      - name: indic_id
        description: "ID de l'indicateur"
      - name: chantier_id
        description: "ID du chantier"
      - name: zone_id
        description: "ID du territoire"
      - name: est_applicable
        description: "Si le chantier est applicable sur le territoire"
  - name: int_ponderation_reelle
    description: |
      Cette table indique 3 pondérations pour chaque couple {indicateur, zone}:

      - `poids_zone_declaree`: pondération déclarée (recueillie par le formulaire DS)
      - `poids_zone_appl`: si l'indicateur est applicable sur cette zone, c'est la pondération déclarée sinon 0 
      - `poids_zone_reel`: pondération réelle, recalculée sur **base 100**. En effet, on normalise la pondération pour que la somme de toutes les pondérations des indicateurs applicables se somment à la valeur **100**.

    columns:
      - name: indic_id
        description: Identifiant unique de l'indicateur
      - name: zone_id
        description: Identifiant de la zone
      - name: est_applicable
        data_type: boolean
        description: Indique si l'indicateur est applicable sur cette zone
      - name: poids_zone_declaree
        description: Pondération déclarée (dans le DS)
      - name: poids_zone_appl
        description: Pondération en prenant en compte les *zones applicables*
      - name: poids_zone_reel
        description: "Pondération réelle: en prenant en compte les *zones applicables* + la remise sur **base 100**"

  - name: int_directeurs_projets
    description: "Une ligne pour chaque chantier qui indique son/ses DP (Directeur de Projet)."
    columns:
      - name: nom
        description: "Liste des noms des DP"
      - name: email
        description: "Liste des emails des DP"
      - name: chantier_id
        description: "Chantier concerné"
  - name: int_coordinateurs_territoriaux
    description: "Une ligne pour chaque zone qui indique son/ses référents territoriaux (ou référents Pilote)"
    columns:
      - name: nom
        description: "Liste des noms des référents"
      - name: email
        description: "Liste des emails des référents"
      - name: territoire_code
        description: "Code du territoire concerné"
      - name: zone_id
        description: "ID de la zone concernée"
  - name: int_responsables_locaux
    description: "Une ligne pour chaque zone et chaque chantier qui indique son/ses responsables locaux"
    columns:
      - name: nom
        description: "Liste des noms des responsables"
      - name: email
        description: "Liste des emails des responsables"
      - name: chantier_id
        description: "Chantier concerné"
      - name: territoire_code
        description: "Code du territoire concerné"
      - name: zone_id
        description: "ID de la zone concernée"
  - name: int_propositions_valeurs
    description: |
      Récupère les metadata des valeurs proposées. Règles:

      - pour une date de valeur actuelle plusieurs propositions peuvent avoir été faites. On prend uniquement la dernière, c'est à dire celle avec la date de proposition la plus récente.
      - on ne garde que les propositions au statut **EN_COURS**
    columns:
      - name: indic_id
        description: "ID de l'indicateur"
      - name: territoire_code
        description: "Code territoire sur lequel la valeur a été proposée"
      - name: date_valeur_actuelle
        description: "Date de la valeur actuelle"
      - name: date_proposition
        description: "Date de la proposition"
      - name: motif_proposition
        description: "Motif de la proposition"
      - name: source_donnee_methode_calcul
        description: "Source de la valeur proposée"
      - name: auteur_proposition
        description: "Auteur de la proposition"
  - name: int_chantiers_zone_applicables
    description: "Une ligne pour chaque chantier et chaque territoire pour les chantiers uniquement applicable sur une zone groupe. Indique si le chantier est applicable sur le territoire"
    columns:
      - name: chantier_id
        description: "ID du chantier"
      - name: zone_id
        description: "ID du territoire"
      - name: zone_est_applicable
        description: "Si le chantier est applicable sur le territoire"
      - name: maille
        description: "Maille du territoire"
      - name: zone_id
        description: "ID de la zone concernée"
  - name: int_last_meteo
    description: "Pour chaque {chantier, territoire}, retourne la dernière météo et sa date."
