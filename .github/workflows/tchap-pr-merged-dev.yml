name: "Message Tchap - PR fermée en dev"

on:
  pull_request:
    types:
      - closed
    branches:
      - 'dev'

jobs:
  send_msg_on_pr_merged:
    name: "Envoi Tchap si PR dev"
    # When the PR is merged
    # https://stackoverflow.com/a/61565445/21676629
    if: github.event.pull_request.merged == true or ${{ !github.event.act }}
    runs-on: ubuntu-latest
    steps:
      - name: get infos pr
        id: PR
        uses: 8BitJonny/gh-get-current-pr@3.0.0
        with:
          # Authetication token to access GitHub APIs. (Can be omitted by default.)
          github-token: ${{ github.token }}
          #sha: d6253749d7945e4cba3b603bc3df502742736af4 # for debug
          sha: ${{ github.event.pull_request.head.sha }}
      - name: "Envoi message Tchap"
        uses: indiesdev/curl@v1.1
        with:
          url: "https://matrix.agent.dinum.tchap.gouv.fr/_matrix/client/r0/rooms/${{ secrets.TCHAP_ROOM_ID_TECH_EVENTS }}/send/m.room.message"
          method: POST
          accept: 200,201,204
          headers: '{ "Authorization": "Bearer ${{ secrets.TCHAP_ACCESS_TOKEN }}" }'
          body: '{"body": "","format":"org.matrix.custom.html","formatted_body":"<h2>[pr-dev] ${{ steps.PR.outputs.pr_title }}</h2> Nouvelle PR mergée <i>en dev</i>. Description de la PR: ${{ steps.PR.outputs.pr_body }} <br><br> <blockquote><a href=\"${{ steps.PR.outputs.pr_url }}\">PR ${{ steps.PR.outputs.number }}</a> <br> <a href=\"https://data-ditp.atlassian.net/wiki/search?spaces=LRSVU&labels=pr-${{ steps.PR.outputs.number }}\">Articles de doc</a></blockquote>","msgtype":"m.text"}'
          timeout: 6000
          retries: 3
