name: CI

on:
  push:
    branches:
      - dev
  pull_request:

env:
  NODE_VERSION: 24.20.0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    outputs:
      pilote-ppg: ${{ steps.filter.outputs.pilote-ppg }}
      pilote-ppg-data-management: ${{ steps.filter.outputs.pilote-ppg-data-management }}
      kpilote-api: ${{ steps.filter.outputs.kpilote-api }}
      kpilote-webapp: ${{ steps.filter.outputs.kpilote-webapp }}
      kpilote-shared: ${{ steps.filter.outputs.kpilote-shared }}
      kpilote-ui: ${{ steps.filter.outputs.kpilote-ui }}
      kpilote-admin: ${{ steps.filter.outputs.kpilote-admin }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pilote-ppg:
              - 'apps/pilote-ppg/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            pilote-ppg-data-management:
              - 'apps/pilote-ppg-data-management/**'
            kpilote-api:
              - 'apps/kpilote-api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            kpilote-webapp:
              - 'apps/kpilote-webapp/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            kpilote-shared:
              - 'packages/kpilote-shared/**'
            kpilote-ui:
              - 'packages/kpilote-ui/**'
            kpilote-admin:
              - 'apps/kpilote-admin/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # Les tests unitaires (client jsdom + server-unit) ne touchent pas la base : ils
  # n'ont besoin ni du service postgres ni du seed, seulement du client Prisma
  # genere pour que les imports resolvent. Les sortir du job d'integration les
  # retire du chemin critique.
  pilote-ppg-test-unit:
    name: "pilote-ppg: unit tests"
    needs: changes
    if: needs.changes.outputs['pilote-ppg'] == 'true'
    runs-on: ubuntu-26.04
    env:
      # `prisma generate` n'ouvre aucune connexion, mais prisma.config.ts resout
      # DATABASE_URL au chargement et leve si elle manque. Meme URL factice que le
      # job de lint.
      DATABASE_URL: postgresql://inutilise:inutilise@127.0.0.1:1/inutilise
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Prisma client
        run: pnpm -F @pilote/ppg exec prisma generate

      - name: Run unit tests
        run: pnpm -F @pilote/ppg test:unit

  pilote-ppg-test-integration:
    name: "pilote-ppg: integration tests"
    needs: changes
    if: needs.changes.outputs['pilote-ppg'] == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7433:5432
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Initialize database
        run: pnpm test:database:init

      - name: Run integration tests
        run: pnpm -F @pilote/ppg test:server:integration

  pilote-ppg-lint:
    name: "pilote-ppg: lint"
    needs: changes
    if: needs.changes.outputs['pilote-ppg'] == 'true'
    runs-on: ubuntu-26.04
    env:
      # Depuis Prisma 7, prisma.config.ts resout DATABASE_URL au chargement et leve si
      # elle manque, ce qui casse meme `prisma generate`. Or ce lint ne se connecte a
      # aucune base : une URL factice suffit a charger la config, et evite de demarrer
      # un service postgres pour rien. (kpilote-api, lui, en a un vrai besoin : son
      # lint fait `prisma generate --sql`, qui introspecte les tables reelles.)
      DATABASE_URL: postgresql://inutilise:inutilise@127.0.0.1:1/inutilise
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint

  kpilote-api-test:
    name: "kpilote-api: tests"
    needs: changes
    if: needs.changes.outputs['kpilote-api'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres?connection_limit=50
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5435:5432
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply Prisma migrations
        # Required before `prisma generate --sql` introspects tables for TypedSQL types
        run: pnpm -F @pilote/kpilote-api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres

      - name: Generate Prisma client
        run: pnpm -F @pilote/kpilote-api prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres

      - name: Run test command
        run: pnpm test
        env:
          APP_PACKAGE: '@pilote/kpilote-api'
          OIDC_ISSUER_URL: https://example.test/realms/test
          OIDC_JWKS_URI: https://example.test/realms/test/protocol/openid-connect/certs
          OIDC_AUDIENCE: test-client
          OIDC_AUTHORIZED_PARTY: test-client

  kpilote-api-lint:
    name: "kpilote-api: lint"
    needs: changes
    if: needs.changes.outputs['kpilote-api'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    env:
      # `prisma generate --sql` introspects tables to type TypedSQL queries — a real DB is required
      DATABASE_URL: postgresql://postgres:postgres@localhost:5436/postgres
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5436:5432
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply Prisma migrations
        run: pnpm -F @pilote/kpilote-api exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm -F @pilote/kpilote-api prisma:generate

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-api'

  kpilote-webapp-test:
    name: "kpilote-webapp: tests"
    needs: changes
    if: needs.changes.outputs['kpilote-webapp'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run test command
        run: pnpm test
        env:
          APP_PACKAGE: '@pilote/kpilote-webapp'
          # kpilote-webapp validates VITE_API_URL at module load (env.ts via Zod).
          # Tests stub fetch globally so no real backend is hit; this only needs to be a valid URL.
          VITE_API_URL: http://localhost:3000

  kpilote-webapp-lint:
    name: "kpilote-webapp: lint"
    needs: changes
    if: needs.changes.outputs['kpilote-webapp'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-webapp'

  kpilote-shared-test:
    name: "kpilote-shared: tests"
    needs: changes
    if: needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run test command
        run: pnpm test
        env:
          APP_PACKAGE: '@pilote/kpilote-shared'

  kpilote-shared-lint:
    name: "kpilote-shared: lint"
    needs: changes
    if: needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-shared'

  kpilote-ui-lint:
    name: "kpilote-ui: lint"
    needs: changes
    if: needs.changes.outputs['kpilote-ui'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-ui'

  kpilote-admin-test:
    name: "kpilote-admin: tests"
    needs: changes
    if: needs.changes.outputs['kpilote-admin'] == 'true' || needs.changes.outputs['kpilote-ui'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run test command
        run: pnpm test
        env:
          APP_PACKAGE: '@pilote/kpilote-admin'

  kpilote-admin-lint:
    name: "kpilote-admin: lint"
    needs: changes
    if: needs.changes.outputs['kpilote-admin'] == 'true' || needs.changes.outputs['kpilote-ui'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-admin'

  pilote-ppg-data-management-lint-sql:
    name: "pilote-ppg-data-management: SQL lint"
    needs: changes
    if: needs.changes.outputs['pilote-ppg-data-management'] == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install SQLFluff
        run: "pip install sqlfluff~=4.2.0 sqlfluff-templater-dbt~=4.2.0 dbt-core~=1.10.20 dbt-duckdb~=1.9.0"
      - name: Install dbt deps
        working-directory: apps/pilote-ppg-data-management
        run: "dbt deps"
      - name: Lint models
        working-directory: apps/pilote-ppg-data-management
        env:
          DBT_TARGET: local
        run: "sqlfluff lint models/ -v"
