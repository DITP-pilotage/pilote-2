name: Tests and Linters

on:
  push:
    branches:
      - dev
  pull_request:

env:
  NODE_VERSION: 24.9.0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      pilote-ppg: ${{ steps.filter.outputs.pilote-ppg }}
      pilote-ppg-data-management: ${{ steps.filter.outputs.pilote-ppg-data-management }}
      kpilote-api: ${{ steps.filter.outputs.kpilote-api }}
      kpilote-webapp: ${{ steps.filter.outputs.kpilote-webapp }}
      kpilote-shared: ${{ steps.filter.outputs.kpilote-shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pilote-ppg:
              - 'apps/pilote-ppg/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            pilote-ppg-data-management:
              - 'apps/pilote-ppg-data-management/**'
            kpilote-api:
              - 'apps/kpilote-api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            kpilote-webapp:
              - 'apps/kpilote-webapp/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            kpilote-shared:
              - 'packages/kpilote-shared/**'

  test:
    name: Run tests
    needs: changes
    if: needs.changes.outputs['pilote-ppg'] == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7433:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Initialize database
        run: pnpm test:database:init

      - name: Run test command
        run: pnpm test

  lint:
    name: Run linters for code
    needs: changes
    if: needs.changes.outputs['pilote-ppg'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint

  test-kpilote-api:
    name: Run tests for kpilote-api
    needs: changes
    if: needs.changes.outputs['kpilote-api'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres?connection_limit=50
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5435:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply Prisma migrations
        # Required before `prisma generate --sql` introspects tables for TypedSQL types
        run: pnpm -F @pilote/kpilote-api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres

      - name: Generate Prisma client
        run: pnpm -F @pilote/kpilote-api prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres

      - name: Run test command
        run: pnpm test
        env:
          APP_PACKAGE: '@pilote/kpilote-api'
          OIDC_ISSUER_URL: https://example.test/realms/test
          OIDC_JWKS_URI: https://example.test/realms/test/protocol/openid-connect/certs
          OIDC_AUDIENCE: test-client
          OIDC_AUTHORIZED_PARTY: test-client

  lint-kpilote-api:
    name: Run linters for kpilote-api
    needs: changes
    if: needs.changes.outputs['kpilote-api'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-latest
    env:
      # `prisma generate --sql` introspects tables to type TypedSQL queries — a real DB is required
      DATABASE_URL: postgresql://postgres:postgres@localhost:5436/postgres
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5436:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply Prisma migrations
        run: pnpm -F @pilote/kpilote-api exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm -F @pilote/kpilote-api prisma:generate

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-api'

  test-kpilote-webapp:
    name: Run tests for kpilote-webapp
    needs: changes
    if: needs.changes.outputs['kpilote-webapp'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run test command
        run: pnpm test
        env:
          APP_PACKAGE: '@pilote/kpilote-webapp'
          # kpilote-webapp validates VITE_API_URL at module load (env.ts via Zod).
          # Tests stub fetch globally so no real backend is hit; this only needs to be a valid URL.
          VITE_API_URL: http://localhost:3000

  lint-kpilote-webapp:
    name: Run linters for kpilote-webapp
    needs: changes
    if: needs.changes.outputs['kpilote-webapp'] == 'true' || needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-webapp'

  lint-kpilote-shared:
    name: Run linters for kpilote-shared
    needs: changes
    if: needs.changes.outputs['kpilote-shared'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and packages
        uses: ./.github/actions/setupNodeAndPackages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint command
        run: pnpm lint
        env:
          APP_PACKAGE: '@pilote/kpilote-shared'

  lint-sql:
    name: Run SQL linter on dbt models
    needs: changes
    if: needs.changes.outputs['pilote-ppg-data-management'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v2
        with:
          python-version: "3.11"
      - name: Install SQLFluff
        run: "pip install sqlfluff~=4.1.0 sqlfluff-templater-dbt~=4.1.0 dbt-core~=1.10.20 dbt-duckdb~=1.9.0"
      - name: Install dbt deps
        working-directory: apps/pilote-ppg-data-management
        run: "dbt deps"
      - name: Lint models
        working-directory: apps/pilote-ppg-data-management
        env:
          DBT_TARGET: local
        run: "sqlfluff lint models/ -v"
