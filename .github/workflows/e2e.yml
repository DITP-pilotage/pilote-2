name: Tests E2E

on:
  schedule:
    - cron: "0 8,14 * * *"
  workflow_dispatch: # Pour déclencher manuellement
    notify_tchap:
      description: "Envoyer notification Tchap"
      required: true
      default: true
      type: boolean
env:
  # Notifications Tchap
  TCHAP_BASE_URL: ${{ secrets.TCHAP_BASE_URL }}
  TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
  TCHAP_ROOM_ID_E2E: ${{ secrets.TCHAP_ROOM_ID_E2E }}
  # Portless tourne sur le port 1355 en CI (non privilégié, sans sudo)
  BASE_URL: https://e2e-pilote.localhost:1355
  NEXTAUTH_URL: https://e2e-pilote.localhost:1355
  WEBAPP_BASE_URL: https://e2e-pilote.localhost:1355
jobs:
  e2e-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7474:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -F @pilote/ppg exec playwright install chromium firefox webkit --with-deps

      - name: Run E2E tests
        id: playwright-tests
        # Un run par navigateur, chacun sur une base re-seedée : un échec Chromium
        # ne doit pas priver la CI des résultats Firefox et WebKit.
        run: |
          status=0
          for project in chromium firefox webkit; do
            E2E_PROJECT=$project pnpm -F @pilote/ppg exec playwright test --project="$project" --no-deps || status=1
          done
          exit $status
        env:
          CI: true
          PLAYWRIGHT_HEADLESS: true

      - name: Parse test results
        id: test-results
        if: failure()
        run: |
          shopt -s nullglob
          RESULTS_FILES=(apps/pilote-ppg/test-results/results-*.json)
          if [ ${#RESULTS_FILES[@]} -gt 0 ]; then
            # Cumuler les informations des tests des trois navigateurs
            sum_stat() { jq -s "map(.stats.$1) | add" "${RESULTS_FILES[@]}" 2>/dev/null || echo "0"; }
            PASSED_TESTS=$(sum_stat expected)
            FAILED_TESTS=$(sum_stat unexpected)
            FLAKY_TESTS=$(sum_stat flaky)
            SKIPPED_TESTS=$(sum_stat skipped)
            TOTAL_TESTS=$((PASSED_TESTS + FAILED_TESTS + FLAKY_TESTS + SKIPPED_TESTS))
            DURATION=$(sum_stat duration)
            
            # Extraire les tests échoués
            FAILED_TEST_NAMES=$(jq -r '.suites[]?.specs[]? | select(.tests[]?.results[]?.status == "failed") | .title' "${RESULTS_FILES[@]}" 2>/dev/null | head -5 | sed 's/^/• /' | tr '\n' '|' | sed 's/|$//')
            
            echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "passed_tests=$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT
            echo "flaky_tests=$FLAKY_TESTS" >> $GITHUB_OUTPUT
            echo "skipped_tests=$SKIPPED_TESTS" >> $GITHUB_OUTPUT
            echo "duration=$DURATION" >> $GITHUB_OUTPUT
            echo "failed_test_names=$FAILED_TEST_NAMES" >> $GITHUB_OUTPUT
          else
            echo "total_tests=N/A" >> $GITHUB_OUTPUT
            echo "passed_tests=N/A" >> $GITHUB_OUTPUT
            echo "failed_tests=N/A" >> $GITHUB_OUTPUT
            echo "flaky_tests=N/A" >> $GITHUB_OUTPUT
            echo "skipped_tests=N/A" >> $GITHUB_OUTPUT
            echo "duration=N/A" >> $GITHUB_OUTPUT
            echo "failed_test_names=Aucun résultat disponible" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results
        id: upload-results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            apps/pilote-ppg/playwright-report/
            apps/pilote-ppg/test-results/
          retention-days: 2

      - name: Notify Tchap on failure
        if: failure()
        env:
          TCHAP_URL: "https://matrix.agent.dinum.tchap.gouv.fr/_matrix/client/r0/rooms/${{ secrets.TCHAP_ROOM_ID_E2E }}/send/m.room.message"
          TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
          BODY: "❌ Tests E2E ÉCHEC"
          FORMATTED_BODY: >-
            <h2>❌ Tests E2E ÉCHEC</h2><h3>📊 Résultats des tests :</h3><ul><li><strong>Total :</strong> ${{ steps.test-results.outputs.total_tests }} tests</li><li><strong>✅ Réussis :</strong> ${{ steps.test-results.outputs.passed_tests }}</li><li><strong>❌ Échoués :</strong> ${{ steps.test-results.outputs.failed_tests }}</li><li><strong>⚠️ Instables :</strong> ${{ steps.test-results.outputs.flaky_tests }}</li><li><strong>⏭️ Ignorés :</strong> ${{ steps.test-results.outputs.skipped_tests }}</li><li><strong>⏱️ Durée :</strong> ${{ steps.test-results.outputs.duration }}ms</li></ul><h3>🔍 Tests échoués :</h3><p>${{ steps.test-results.outputs.failed_test_names }}</p><h3>🔗 Liens utiles :</h3><ul><li><strong>Commit :</strong> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></li><li><strong>Workflow :</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Voir les logs</a></li><li><strong>Artefacts :</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Télécharger les rapports</a></li><li><strong>Environnement :</strong> <a href="${{ env.BASE_URL }}">${{ env.BASE_URL }}</a></li></ul><p><em>Branche : ${{ github.ref_name }} | Déclenché par : ${{ github.actor }}</em></p>
        run: |
          jq -n --arg body "$BODY" --arg formatted "$FORMATTED_BODY" \
            '{body: $body, format: "org.matrix.custom.html", formatted_body: $formatted, msgtype: "m.text"}' |
            curl --fail-with-body --silent --show-error --max-time 6 --retry 3 --retry-all-errors \
              -X POST "$TCHAP_URL" \
              -H "Authorization: Bearer $TCHAP_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-
