name: "Lancer les datajobs selon l'environnement"

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à tester"
        required: true
        default: 'dev-datajobs'
        type: choice
        options:
          - dev-datajobs
          - preprod-datajobs
          - prod-datajobs-ditp
jobs:
  trigger-scalingo:
    name: "Lancement datajobs pour l'environ : ${{inputs.environment}}"
    runs-on: ubuntu-latest
    steps:
    - name: "Vérification horaire"
      run: |
        current_minute=$(date +%M)
        if [ $current_minute -ge 55 ] || [ $current_minute -le 10 ]; then
          echo "❌ Trigger interdit entre XXh55 et XX+1h10 (conflit CRON)"
          echo "Minute actuelle: $current_minute"
          echo "Environnement demandé: ${{ inputs.environment }}"
          exit 1
        fi
        echo "✅ Trigger autorisé (minute: $current_minute)"

    - uses: scalingo-community/setup-scalingo@v0.1.1
      with:
        region: 'osc-secnum-fr1'
        api_token: ${{ secrets.SCALINGO_API_TOKEN }}
        app_name: ${{ inputs.environment }}

    - run: scalingo run /bin/bash scripts/run_datajobs.sh
