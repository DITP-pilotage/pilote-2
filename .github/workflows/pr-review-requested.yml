name: "Demande de review sur une Pull request"

on:
  pull_request:
    types:
      - labeled

jobs:
  send_msg_on_review_requested:
    name: "Envoi Tchap si review demandée"
    if: github.event.label.name == 'review-requested'
    runs-on: ubuntu-26.04
    steps:
      - name: get infos pr
        id: PR
        uses: 8BitJonny/gh-get-current-pr@3.0.0
        with:
          github-token: ${{ github.token }}
          sha: ${{ github.event.pull_request.head.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: "checkout"
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: "Envoi message Tchap"
        env:
          TCHAP_BASE_URL: ${{ secrets.TCHAP_BASE_URL }}
          TCHAP_ROOM_ID: ${{ secrets.TCHAP_ROOM_ID_REVIEW }}
          TCHAP_BOT_USER_ID: ${{ secrets.TCHAP_BOT_USER_ID }}
          TCHAP_BOT_DEVICE_ID: ${{ secrets.TCHAP_BOT_DEVICE_ID }}
          TCHAP_BOT_ACCESS_TOKEN: ${{ secrets.TCHAP_BOT_ACCESS_TOKEN }}
          TCHAP_BOT_OLM_ACCOUNT: ${{ secrets.TCHAP_BOT_OLM_ACCOUNT }}
          BODY: ""
          FORMATTED_BODY: >-
            <h2>[review] ${{ steps.PR.outputs.pr_title }}</h2> Une review est demandée sur cette PR. <br> <blockquote><a href="${{ steps.PR.outputs.pr_url }}">PR ${{ steps.PR.outputs.number }}</a></blockquote>
        run: uv run --with "matrix-nio[e2e]~=0.26.0" python .github/scripts/send_tchap.py
