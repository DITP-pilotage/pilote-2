name: "Demande de review sur une Pull request"

on:
  pull_request:
    types:
      - labeled

jobs:
  send_msg_on_review_requested:
    name: "Envoi Tchap si review demandée"
    if: github.event.label.name == 'review-requested'
    runs-on: ubuntu-26.04
    steps:
      - name: get infos pr
        id: PR
        uses: 8BitJonny/gh-get-current-pr@3.0.0
        with:
          github-token: ${{ github.token }}
          sha: ${{ github.event.pull_request.head.sha }}
      - name: "Envoi message Tchap"
        env:
          TCHAP_URL: "https://matrix.agent.dinum.tchap.gouv.fr/_matrix/client/r0/rooms/${{ secrets.TCHAP_ROOM_ID_REVIEW }}/send/m.room.message"
          TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
          BODY: ""
          FORMATTED_BODY: >-
            <h2>[review] ${{ steps.PR.outputs.pr_title }}</h2> Une review est demandée sur cette PR. <br> <blockquote><a href="${{ steps.PR.outputs.pr_url }}">PR ${{ steps.PR.outputs.number }}</a></blockquote>
        run: |
          jq -n --arg body "$BODY" --arg formatted "$FORMATTED_BODY" \
            '{body: $body, format: "org.matrix.custom.html", formatted_body: $formatted, msgtype: "m.text"}' |
            curl --fail-with-body --silent --show-error --max-time 6 --retry 3 --retry-all-errors \
              -X POST "$TCHAP_URL" \
              -H "Authorization: Bearer $TCHAP_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-
