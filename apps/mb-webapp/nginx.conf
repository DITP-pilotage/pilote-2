root /app/dist;

index index.html;

# Gzip
gzip on;
gzip_types
  application/javascript
  application/json
  application/xml
  font/woff2
  image/svg+xml
  text/css
  text/javascript
  text/plain;

# Cache long pour les assets versionnés (Vite ajoute un hash dans le nom de fichier)
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# Healthcheck léger pour Scalingo
location = /healthz {
  access_log off;
  return 200 "ok\n";
  add_header Content-Type text/plain;
}

# SPA fallback : toute route inconnue retourne index.html (routing client-side)
location / {
  try_files $uri $uri/ /index.html;
}
