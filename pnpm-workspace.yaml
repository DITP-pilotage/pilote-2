packages:
  - "apps/*"
  - "packages/*"

# Refuse d'installer une version publiée il y a moins de 2 semaines
# (mitigation supply-chain : laisse le temps de détecter un package compromis)
# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 20160
# https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  # TEMPORAIRE — à retirer après le 2026-08-03 22:57 UTC.
  # next-auth est épinglé en exact 5.0.0-beta.32 (campagne du 2026-07-27, 5 advisories
  # Auth.js dont 2 critical), publiée le 2026-07-20 : encore sous quarantaine. Le lock la
  # réutilise sans broncher, mais `pnpm deploy --legacy` (deploy-bundle des apps kpilote)
  # re-résout et n'a aucun fallback sur un pin exact -> build cassé.
  # @auth/core est du même lot : next-auth l'épingle en exact 0.41.3, publiée le même jour.
  - next-auth
  - "@auth/core"
