packages:
  - "apps/*"
  - "packages/*"

# Refuse d'installer une version publiée il y a moins de 2 semaines
# (mitigation supply-chain : laisse le temps de détecter un package compromis)
# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 20160
# https://pnpm.io/settings#minimumreleaseageexclude
# Chaque entrée porte un marqueur `# expire: <AAAA-MM-JJ|jamais>` que
# `pnpm deps:quarantaine` lit pour décider si l'exclusion est encore justifiée. Une
# exclusion est un trou volontaire dans la mitigation supply-chain : sans échéance
# lisible par une machine, personne ne le referme (constaté trois campagnes de suite).
minimumReleaseAgeExclude:
  # expire: jamais
  # next et @next/* relèvent d'une politique permanente, pas d'un contournement daté.
  - next
  - "@next/*"
  # expire: 2026-11-02
  # Correctif d'advisories fast-uri (scheme spoofing, host confusion) : 3.1.9 et 4.2.3, publiés
  # le 2026-10-19. Exclusion par nom car pnpm 10.28 ignore la forme `fast-uri@4.2.3` pour une
  # dépendance transitive ; les overrides épinglent les versions exactes pour que l'exclusion ne
  # laisse passer qu'elles. À l'échéance : retirer l'exclusion et repasser les overrides en plancher.
  - fast-uri
  # expire: 2026-11-01
  # Correctif d'advisories seroval (injection via typed array et RegExp) : 1.6.11, publié le
  # 2026-10-18. Même mécanisme : l'override épingle 1.6.11, sans lui la résolution prend 1.7.3
  # publiée la veille.
  - seroval
