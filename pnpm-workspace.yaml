packages:
  - "apps/*"
  - "packages/*"

# Refuse d'installer une version publiée il y a moins de 2 semaines
# (mitigation supply-chain : laisse le temps de détecter un package compromis)
# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 20160
# https://pnpm.io/settings#minimumreleaseageexclude
# Chaque entrée porte un marqueur `# expire: <AAAA-MM-JJ|jamais>` que
# `pnpm deps:quarantaine` lit pour décider si l'exclusion est encore justifiée. Une
# exclusion est un trou volontaire dans la mitigation supply-chain : sans échéance
# lisible par une machine, personne ne le referme (constaté trois campagnes de suite).
minimumReleaseAgeExclude:
  # expire: jamais
  # next et @next/* relèvent d'une politique permanente, pas d'un contournement daté.
  - next
  - "@next/*"
